[project]
name = "markov-lean"
version = "0.1.0"
description = "Area transitions in Lean proofs: Markov state models over goal-state trajectories, and area-aware proof search."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "pyarrow>=14",
  "deeptime>=0.4.4",
  "pyyaml>=6",
]

[project.optional-dependencies]
judge = ["anthropic>=0.70"]
search = ["httpx>=0.27"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
markov-lean = "markov_lean.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
