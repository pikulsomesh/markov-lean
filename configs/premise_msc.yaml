# Mathlib folder -> MSC 2020 top-level code, for `markov-lean premise-labels`.
#
# A premise (a lemma or definition a tactic step uses) is placed by the file it is
# defined in.  Its path inside Mathlib, without `.lean`, is matched against the keys
# below; the longest key that is a whole-folder prefix wins
# (`Algebra/Order/Ring/Lemmas` matches `Algebra/Order` before `Algebra`).
# Codes are the judges' two-digit MSC 2020 classes (src/markov_lean/msc.py).
#
# `null` means "no area": the premise is ignored, as if the step had not cited it.
# Files outside Mathlib (Lean core, Batteries, Aesop) are always ignored.
#
# Folders listed under `glue` are general-purpose foundations that proofs in every
# area use (logic, sets, basic orders and intervals, finite types, ordered-ring inequalities,
# and the basic identities of groups and rings).  The main labels
# ignore them; the `premise_glue` variant gives them the code below.
#
# The table is a judgement call and is deliberately small.  Where a folder spans two
# classes, the code is the one its lemmas are mostly about (e.g. Analysis/SpecialFunctions
# is exp, log, rpow and trigonometry on the reals, so 26, not 33).

areas:
