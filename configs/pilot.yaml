# Phase 2 pilot: do Markov-model macrostates over goal states line up with MSC areas?
# Run: markov-lean pilot --out results/pilot
# The first run fits the model and writes the judge sample (no API calls).
# After the judges' labels are in results/pilot/judge/labels.parquet, the same command scores and makes the gate 1 call.
data:
  source: leandojo          # leandojo | workbook | synthetic
  split: train
  processed_dir: data/processed
  max_proofs: 20000         # keeps the run within the Mac Mini's 16 GB
  min_steps: 8              # most LeanDojo proofs are 1-4 steps; an area change needs room, and the
                            # Chapman-Kolmogorov test needs proofs longer than 4 x lag
  seed: 0
msm:                        # any field of markov_lean.msm.MSMConfig
  featurizer: tfidf_svd
  featurizer_kwargs: {n_components: 128}
  n_microstates: [100, 200, 400]   # picked by cross-validated VAMP-2
  lag: auto                 # picked by implied-timescale convergence
  n_macrostates: 10         # fixed before seeing labels; on the first Mac run the spectral gap alone picked 2
  max_macrostates: 12
  bayesian_samples: 50
judge:
  config: configs/judge.yaml
  sample_proofs: 10000   # above the pilot's 8,423 proofs, so the judges label all of them
eval:
  topk: [1, 3]
  macrostate_sweep: [2, 4, 6, 8, 10, 12]   # agreement at each k, reported next to the gate
  gate_nmi: 0.15            # gate 1: macrostates must clear this and beat the Mathlib-folder baseline
